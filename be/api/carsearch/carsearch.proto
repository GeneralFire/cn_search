syntax = "proto3";

package carsearch;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/GeneralFire/cn_search/be/pkg/carsearch;carsearch";

// CarSearchService — поиск фиксаций госномеров.
//
// HTTP-аннотаций нет намеренно: HTTP-ручки генерирует clay с флагом
// generate_unbound_methods — каждый метод доступен как
// POST /carsearch.CarSearchService/<Method> с JSON-телом запроса.
service CarSearchService {
  // Search ищет номера: по самому номеру и по уточнениям (clarifications) к его фиксациям.
  // Один номер — одна строка (последняя подходящая фиксация). От новых к старым, постранично.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Get по идентификатору фиксации возвращает все фиксации того же номера — от новых к старым.
  rpc Get(GetRequest) returns (GetResponse);

  // SeeAlso — свежие фиксации других номеров (блок внизу страницы номера): один номер — одна
  // карточка, номер открытой фиксации исключён. Не более 21.
  rpc SeeAlso(SeeAlsoRequest) returns (SeeAlsoResponse);

  // Clarify — уточнение номера к фиксации («на самом деле номер такой»). Номер нормализуется
  // (пробелы, регистр; для RU — латинские двойники → кириллица, «0» в буквенных позициях → «О»)
  // и проверяется по формату plate_type; ошибка формата или совпадение с текущим номером
  // фиксации — INVALID_ARGUMENT с текстом для пользователя. Создаётся «не принят»; когда
  // 3 уточнения фиксации совпали (без учёта похожих символов), все они становятся «принят».
  rpc Clarify(ClarifyRequest) returns (ClarifyResponse);

  // Complain — жалоба на фото фиксации (кнопка «Пожаловаться»). Создаётся со статусом «новая».
  rpc Complain(ComplainRequest) returns (Complaint);

  // ListComplaints — жалобы для админ-панели, от новых к старым, постранично, вместе с фиксацией.
  // Нужен заголовок admin-token (= ADMIN_TOKEN бэка), иначе PERMISSION_DENIED.
  rpc ListComplaints(ListComplaintsRequest) returns (ListComplaintsResponse);

  // ResolveComplaint — отметить жалобу решённой. Нужен заголовок admin-token.
  rpc ResolveComplaint(ResolveComplaintRequest) returns (Complaint);

  // SetClarificationStatus — принять или отклонить уточнение вручную. Нужен заголовок admin-token.
  rpc SetClarificationStatus(SetClarificationStatusRequest) returns (Clarification);

  // HideSighting — скрыть фиксацию (hidden = true) или вернуть её. Скрытые фиксации не попадают
  // в Search/Get/SeeAlso обычных пользователей; админу отдаются с hidden = true. Нужен admin-token.
  rpc HideSighting(HideSightingRequest) returns (PlateSighting);

  // ListClarifications — уточнения для админ-панели, от новых к старым, постранично, вместе с фиксацией.
  // Нужен заголовок admin-token.
  rpc ListClarifications(ListClarificationsRequest) returns (ListClarificationsResponse);

  // Me — кто я: is_admin — верный заголовок admin-token; authenticated и user — по токену пользователя
  // (cookie cs_token или Authorization: Bearer). Нет токена или он неверный — authenticated = false.
  rpc Me(MeRequest) returns (MeResponse);

  // Register — новый пользователь (тариф Free). Токен входа возвращается один раз — в базе только его sha256.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Plans — тарифы: цена, период, состав.
  rpc Plans(PlansRequest) returns (PlansResponse);

  // CreatePayment — платёж за тариф и адрес кассы (пока демо-касса /pay/mock/<id>). Нужен токен
  // пользователя, иначе UNAUTHENTICATED.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // ConfirmMockPayment — итог демо-оплаты: success — платёж оплачен, Pro продлён на 30 дней от
  // max(сейчас, pro_until); иначе — отменён. Только свой платёж в статусе pending. Нужен токен.
  rpc ConfirmMockPayment(ConfirmMockPaymentRequest) returns (Payment);

  // ListMyPayments — история платежей пользователя, от новых к старым (последние 50). Нужен токен.
  rpc ListMyPayments(ListMyPaymentsRequest) returns (ListMyPaymentsResponse);
}

// PlateSighting — фиксация номера: где и когда замечена машина.
message PlateSighting {
  // uuid фиксации.
  string id = 1;
  // URL полного фото (S3).
  string photo_url = 2;
  string address = 3;
  // Госномер кириллицей: "А123ВС 777".
  string plate = 4;
  // Когда номер зафиксирован.
  google.protobuf.Timestamp created_at = 5;
  // URL миниатюры (S3) — для списков; полное фото — photo_url.
  string thumb_url = 6;
  // Формат номера (plates.meta.type); не задан — неизвестен.
  PlateType plate_type = 7;
  // Страна (ЕС: "D") или штат (США: "CA") для формата номера.
  string plate_region = 8;
  // Язык, на котором записан адрес: "ru", "en", "de", …
  string address_locale = 9;
  // Координаты места фиксации (WGS 84, градусы); не заданы — точка неизвестна.
  optional double lat = 10;
  optional double lon = 11;
  // Фиксация скрыта админом; приходит только админу (обычным пользователям скрытые не отдаются).
  bool hidden = 12;
}

// Формат номерного знака — от него зависит, как его рисовать.
enum PlateType {
  PLATE_TYPE_DEFAULT = 0; // неизвестен
  PLATE_TYPE_RU = 1;
  PLATE_TYPE_EU = 2;
  PLATE_TYPE_US = 3;
  PLATE_TYPE_UA = 4; // украинский: "АА 1234 ВС"
  PLATE_TYPE_CN = 5; // китайский: "京A·12345"
}

message SearchRequest {
  // Поисковая строка, как есть передаётся в plainto_tsquery('simple', plate) и сопоставляется
  // с to_tsvector('simple', plate): каждое слово должно совпасть со словом номера —
  // серией "А123ВС" или регионом "777". Пусто — все записи.
  string plate = 1;
  // Сколько записей пропустить (для бесконечной прокрутки).
  int32 offset = 2;
  // Размер страницы, 1..100; 0 — по умолчанию (35).
  int32 limit = 3;
  // «Рынок» номеров (главная: блок по языку интерфейса и вкладки стран):
  // "ru" — российские, "ua" — украинские, "de" — ЕС с регионом D, "us" — США, "cn" — китайские,
  // "other" — всё, что не попало ни в один рынок (формат неизвестен или другая страна).
  // Пусто — без фильтра.
  string market = 4;
}

message SearchResponse {
  repeated PlateSighting items = 1;
  // Всего найдено номеров по запросу.
  int32 total = 2;
  // Смещение следующей страницы; не задано — дальше ничего нет.
  optional int32 next_offset = 3;
  // «Возможно, вы искали»: только при total = 0 и непустом запросе — до 5 номеров, ближайших
  // к запросу по расстоянию правки (levenshtein) между ключами plate_search_key без пробелов,
  // не дальше 2 правок; по одной (последней) фиксации на номер, ближайшие первыми.
  repeated PlateSighting suggestions = 4;
}

message GetRequest {
  // uuid любой фиксации номера.
  string id = 1;
}

message GetResponse {
  // Все фиксации номера, от новых к старым; первая по id всегда среди них.
  repeated PlateSighting items = 1;
  // Уточнения ко всем фиксациям номера, сгруппированные по предложенному номеру (без учёта
  // похожих символов): сначала принятые, затем по числу предложений и свежести. Нет — пусто.
  repeated PlateClarification clarifications = 2;
}

// PlateClarification — предложенный номер и сколько раз его предлагали к фиксациям номера.
message PlateClarification {
  // Предложенный номер (написание из самого свежего уточнения группы): "А123ВС 77".
  string plate = 1;
  PlateType plate_type = 2;
  string plate_region = 3;
  // Сколько уточнений с этим номером.
  int32 count = 4;
  // ACCEPTED, если среди них есть принятые; иначе NOT_ACCEPTED.
  ClarificationStatus status = 5;
  // uuid фиксаций, к которым этот номер предлагали.
  repeated string sighting_ids = 6;
  // Сами уточнения группы, от новых к старым (модерация в админ-режиме — по id).
  repeated Clarification items = 7;
}

message SeeAlsoRequest {
  // uuid открытой фиксации: её номер в выдачу не попадает. Пусто — без исключения.
  string id = 1;
  // Сколько карточек, 1..21; 0 — 21.
  int32 limit = 2;
}

message SeeAlsoResponse {
  repeated PlateSighting items = 1;
}

// Статус уточнения.
enum ClarificationStatus {
  CLARIFICATION_STATUS_UNSPECIFIED = 0;
  CLARIFICATION_STATUS_NOT_ACCEPTED = 1;
  CLARIFICATION_STATUS_ACCEPTED = 2;
}

// Clarification — уточнение номера к фиксации.
message Clarification {
  string id = 1;
  // uuid фиксации, к которой уточнение.
  string sighting_id = 2;
  // Предложенный номер в нормализованном виде: "А123ВС 77".
  string plate = 3;
  // Актуальный статус: ACCEPTED, когда совпали 3 уточнения фиксации.
  ClarificationStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  PlateType plate_type = 6;
  string plate_region = 7;
  // Фиксация (номер, адрес, фото) — только в ListClarifications.
  PlateSighting sighting = 8;
}

message ClarifyRequest {
  // uuid фиксации.
  string sighting_id = 1;
  // Номер, 1..32 символа. RU: А123ВС 77 / А123ВС 777 (пробел перед регионом можно не ставить);
  // EU/US: 2..12 символов — латиница, цифры, пробел, дефис; DEFAULT — формат не проверяется.
  string plate = 2;
  // Формат номера; DEFAULT — другой/неизвестен.
  PlateType plate_type = 3;
  // Страна (ЕС: "D") или штат (США: "CA"), до 3 латинских букв; для RU/DEFAULT не нужен.
  string plate_region = 4;
}

message ClarifyResponse {
  Clarification clarification = 1;
}

// Причина жалобы на фото.
enum ComplaintReason {
  COMPLAINT_REASON_UNSPECIFIED = 0;
  COMPLAINT_REASON_WRONG_PLATE = 1;   // номер распознан неверно / не та машина
  COMPLAINT_REASON_BAD_PHOTO = 2;     // фото плохое: размыто, темно, не видно машину
  COMPLAINT_REASON_PERSONAL_DATA = 3; // в кадре лица или другие личные данные
  COMPLAINT_REASON_OTHER = 4;
}

// Статус жалобы.
enum ComplaintStatus {
  COMPLAINT_STATUS_UNSPECIFIED = 0; // в фильтре ListComplaints — все
  COMPLAINT_STATUS_NEW = 1;
  COMPLAINT_STATUS_RESOLVED = 2;
}

// Complaint — жалоба на фото фиксации.
message Complaint {
  string id = 1;
  // uuid фиксации, на фото которой жалоба.
  string sighting_id = 2;
  ComplaintReason reason = 3;
  string comment = 4;
  ComplaintStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  // Фиксация (номер, адрес, фото, время) — только в ListComplaints.
  PlateSighting sighting = 7;
}

message ComplainRequest {
  // uuid фиксации.
  string sighting_id = 1;
  // Причина, обязательна.
  ComplaintReason reason = 2;
  // Комментарий, до 500 символов; можно пусто.
  string comment = 3;
}

message ListComplaintsRequest {
  // Сколько жалоб пропустить («Загрузить ещё»).
  int32 offset = 1;
  // Размер страницы, 1..100; 0 — по умолчанию (30).
  int32 limit = 2;
  // Фильтр по статусу; UNSPECIFIED — все.
  ComplaintStatus status = 3;
  // Только жалобы на эту фиксацию (uuid); пусто — все.
  string sighting_id = 4;
}

message ListComplaintsResponse {
  repeated Complaint items = 1;
  // Всего жалоб по фильтру.
  int32 total = 2;
  // Смещение следующей страницы; не задано — дальше ничего нет.
  optional int32 next_offset = 3;
}

message ResolveComplaintRequest {
  // uuid жалобы.
  string id = 1;
}

message SetClarificationStatusRequest {
  // uuid уточнения.
  string id = 1;
  // ACCEPTED или NOT_ACCEPTED.
  ClarificationStatus status = 2;
}

message HideSightingRequest {
  // uuid фиксации.
  string id = 1;
  // true — скрыть, false — показать снова.
  bool hidden = 2;
}

message ListClarificationsRequest {
  // Фильтр по статусу; UNSPECIFIED — все.
  ClarificationStatus status = 1;
  // Сколько пропустить («Загрузить ещё»).
  int32 offset = 2;
  // Размер страницы, 1..100; 0 — по умолчанию (30).
  int32 limit = 3;
  // Только уточнения к этой фиксации (uuid); пусто — все.
  string sighting_id = 4;
}

message ListClarificationsResponse {
  repeated Clarification items = 1;
  // Всего уточнений по фильтру.
  int32 total = 2;
  // Смещение следующей страницы; не задано — дальше ничего нет.
  optional int32 next_offset = 3;
}

// ---------------------------------------------------------------- аккаунт, тарифы, оплата

// Тариф пользователя.
enum UserPlan {
  USER_PLAN_UNSPECIFIED = 0;
  USER_PLAN_FREE = 1;
  USER_PLAN_PRO = 2;
}

// User — пользователь.
message User {
  // uuid пользователя.
  string id = 1;
  // E-mail; пусто — не указан.
  string email = 2;
  // Действующий тариф (Pro с истёкшим сроком — уже Free).
  UserPlan plan = 3;
  // До какого момента действует Pro; не задано — не покупал.
  google.protobuf.Timestamp pro_until = 4;
  google.protobuf.Timestamp created_at = 5;
}

message MeRequest {}

message MeResponse {
  // Заголовок admin-token верный.
  bool is_admin = 1;
  // Токен пользователя верный; иначе user не задан.
  bool authenticated = 2;
  User user = 3;
}

message RegisterRequest {
  // Необязательно; уникален.
  string email = 1;
}

message RegisterResponse {
  // Токен входа "cs_…" — показывается один раз, восстановить нельзя.
  string token = 1;
  User user = 2;
}

message PlansRequest {}

// PlanInfo — тариф.
message PlanInfo {
  UserPlan plan = 1;
  string title = 2;
  // Цена за период в копейках/центах; 0 — бесплатно.
  int32 amount_cents = 3;
  // Валюта ISO 4217: "RUB".
  string currency = 4;
  // Период в днях; 0 — бессрочно.
  int32 period_days = 5;
  // Ключи возможностей: "search", "uploads_limited", "pro_badge", "unlimited_uploads", "notifications".
  repeated string features = 6;
  // Лимит загрузок фото в сутки; 0 — без ограничений.
  int32 uploads_per_day = 7;
}

message PlansResponse {
  repeated PlanInfo items = 1;
}

// Статус платежа.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_CANCELED = 3;
}

// Payment — платёж за тариф.
message Payment {
  string id = 1;
  UserPlan plan = 2;
  int32 amount_cents = 3;
  string currency = 4;
  PaymentStatus status = 5;
  // Платёжный провайдер; пока только "mock".
  string provider = 6;
  google.protobuf.Timestamp created_at = 7;
  // Когда оплачен или отменён.
  google.protobuf.Timestamp confirmed_at = 8;
}

message CreatePaymentRequest {
  // Покупаемый тариф; сейчас только PRO.
  UserPlan plan = 1;
}

message CreatePaymentResponse {
  string payment_id = 1;
  // Куда перейти для оплаты: "/pay/mock/<id>".
  string checkout_url = 2;
  Payment payment = 3;
}

message ConfirmMockPaymentRequest {
  string payment_id = 1;
  // true — «Оплатить», false — «Отменить».
  bool success = 2;
}

message ListMyPaymentsRequest {}

message ListMyPaymentsResponse {
  repeated Payment items = 1;
}
