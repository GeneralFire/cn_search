# Локальное окружение для разработки.
# Данные БД и S3 — в ./.data на хосте (bind mount): переживают перезапуск, `docker-compose down -v`,
# очистку томов и пересоздание VM Docker. Удалить данные: `make reset`.
# Пароли ниже — только для локальных контейнеров (порты БД и S3 открыты лишь на 127.0.0.1);
# переопределяются через .env: POSTGRES_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY.

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-carsearch}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carsearch-dev}
  POSTGRES_DB: carsearch

x-db-url: &db-url postgres://${POSTGRES_USER:-carsearch}:${POSTGRES_PASSWORD:-carsearch-dev}@db:5432/carsearch?sslmode=disable


services:
  # --- Postgres: машины ---
  db:
    image: postgres:17-alpine
    environment: *db-env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d carsearch"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- S3 (RustFS — S3-совместимое хранилище, замена MinIO): картинки машин ---
  # Образы minio/minio больше не публикуются на Docker Hub.
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-carsearch}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-carsearch-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # веб-консоль
    volumes:
      - ./.data/s3:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Миграции БД (goose, вместе с тестовыми данными 0002_test_data): при `make etc` / `up` ---
  migrate:
    image: kukymbr/goose-docker:3.28.0
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *db-url
      GOOSE_COMMAND: ${GOOSE_COMMAND:-up} # make migrate CMD=status|down|redo|version
      GOOSE_COMMAND_ARG: ${GOOSE_COMMAND_ARG:-}
    volumes:
      - ./be/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # --- Бакет cars с анонимным чтением + тестовые картинки (make etc), затем завершается ---
  s3-init:
    image: amazon/aws-cli:2.39.7
    entrypoint: ["/seed/upload.sh"]
    environment:
      S3_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-carsearch}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-carsearch-dev}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./be/internal/test_utils/s3:/seed:ro
    depends_on:
      s3:
        condition: service_healthy

  # --- Распознавание номеров (fast-alpr: YOLO-детектор + OCR, ONNX, CPU) для rpc Ingest ---
  # Порт наружу не открыт: к сервису ходит только бэк по сети compose (http://ocr:8000).
  # Веса моделей скачиваются при сборке образа (docs/OCR_PIPELINE.md).
  ocr:
    build: ./ocr
    restart: unless-stopped

  # --- Бэкенд (Go + clay) ---
  be:
    build: ./be
    environment:
      PORT: "8080"
      GRPC_PORT: "8082"
      DATABASE_URL: *db-url
      S3_PUBLIC_URL: /s3/cars # браузер получает картинки через прокси фронта (бакет и картинки — s3-init)
      # Пароль админ-панели /admin (заголовок admin-token). Значение по умолчанию — только для локальной
      # разработки, как пароль БД выше; в бою задать в .env. Пусто — админские методы выключены.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-carsearch-admin-dev}
      # Ключ HMAC-подписи API-токенов (cst_…). По умолчанию — локальный dev-ключ, как пароль БД выше;
      # в бою задать в .env. Смена ключа делает все выпущенные токены недействительными.
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:-carsearch-token-signing-dev}
      # rpc Ingest: фото → OCR → фиксация; фото кладутся в бакет cars (каталог u/).
      OCR_URL: http://ocr:8000
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-carsearch}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-carsearch-dev}
      S3_BUCKET: cars
    ports:
      - "127.0.0.1:8080:8080" # HTTP: /api/...
      - "127.0.0.1:8082:8082" # gRPC
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
    # Готовность: /api/ready пингует БД и бакет S3 (503, если что-то недоступно); fe ждёт service_healthy.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Фронтенд (Vite, hot-reload) ---
  fe:
    build: ./fe
    environment:
      VITE_USE_POLLING: "true" # надёжный hot-reload с bind-mount на macOS
      VITE_INCLUDE_TEST_DATA: "true" # фронт шлёт include-test-data: в базе пока только тестовые данные
      API_URL: http://be:8080
      S3_URL: http://s3:9000
    ports:
      - "7173:7173" # доступен из локальной сети
    volumes:
      - ./fe:/app # исходники с хоста → hot-reload
      - /app/node_modules # node_modules из образа, а не с хоста (macOS ≠ linux)
    depends_on:
      be:
        condition: service_healthy
    restart: unless-stopped
