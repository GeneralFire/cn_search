<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Поиск по авто — вариант A</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #14171a;
    --muted: #6b7380;
    --border: #e3e6ea;
    --accent: #2f6bff;
    --accent-soft: #e8efff;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --shadow-hover: 0 2px 4px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.12);
    --radius: 16px;
    color-scheme: light;
    font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #181b21; --text: #eef0f3; --muted: #959dab;
      --border: #272b33; --accent: #6b95ff; --accent-soft: #1d2740;
      --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-hover: 0 12px 32px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  .hero {
    padding: 72px 24px 56px;
    background:
      radial-gradient(1200px 400px at 20% -10%, var(--accent-soft), transparent 70%),
      var(--bg);
  }
  .hero__inner { max-width: 720px; margin: 0 auto; text-align: center; }
  .hero h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -.02em; margin: 0 0 8px; }
  .hero p { color: var(--muted); margin: 0 0 32px; }

  .searchbar {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px; box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s;
  }
  .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }

  .segmented { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; position: relative; flex-shrink: 0; }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    padding: 8px 16px; border-radius: 999px; font-size: .9rem; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: background .2s, color .2s;
  }
  .segmented input:checked + label { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .segmented input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

  .searchbar__icon { color: var(--muted); margin-left: 8px; flex-shrink: 0; }
  .searchbar__input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 1rem; color: inherit; padding: 10px 4px;
  }
  .searchbar__input::-webkit-search-cancel-button { display: none; }
  .searchbar__clear {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%; display: none; flex-shrink: 0;
  }
  .searchbar__clear:hover { background: var(--bg); color: var(--text); }
  .searchbar.has-value .searchbar__clear { display: grid; place-items: center; }

  .content { max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; }
  .content__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .content__count { color: var(--muted); font-size: .9rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
    animation: in .3s ease both;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  .card__photo {
    aspect-ratio: 16 / 9; display: grid; place-items: center; position: relative;
    background: linear-gradient(135deg, var(--accent-soft), var(--bg));
    color: var(--accent);
  }
  .card__photo img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .card__photo svg { width: 38%; opacity: .55; }
  .card__badge {
    position: absolute; top: 12px; left: 12px; background: var(--surface); color: var(--text);
    font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; box-shadow: var(--shadow);
  }

  .card__body { padding: 16px 18px 18px; display: grid; gap: 12px; }
  .card__address { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-weight: 500; line-height: 1.35; }
  .card__address svg { flex-shrink: 0; color: var(--accent); margin-top: 2px; }
  .card__row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card__key { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .85rem; color: var(--muted); }

  /* Российский номерной знак */
  .plate {
    display: inline-flex; align-items: stretch; border: 2px solid #1a1a1a; border-radius: 6px;
    background: #fff; color: #111; font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
    font-weight: 700; font-size: .95rem; line-height: 1; overflow: hidden;
  }
  .plate__num { padding: 6px 8px; letter-spacing: .04em; }
  .plate__reg {
    border-left: 2px solid #1a1a1a; padding: 3px 6px 2px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: .8rem; gap: 1px;
  }
  .plate__rus { font-size: .45rem; display: flex; align-items: center; gap: 2px; font-weight: 600; }
  .plate__flag { width: 10px; height: 6px; background: linear-gradient(#fff 33%, #1c3fae 33% 66%, #d52b1e 66%); border: .5px solid #999; }

  .card__date { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }

  .empty {
    grid-column: 1 / -1; text-align: center; padding: 64px 24px; color: var(--muted);
    border: 2px dashed var(--border); border-radius: var(--radius);
  }
  .empty strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 6px; }

  mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 1px; }

  @media (max-width: 600px) {
    .hero { padding: 40px 16px 32px; }
    .searchbar { flex-wrap: wrap; border-radius: 20px; }
    .segmented { width: 100%; }
    .segmented label { flex: 1; text-align: center; }
    .content { padding: 0 16px 48px; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <h1>Поиск по авто</h1>
      <p>Найдите автомобиль по госномеру или ключу</p>
      <div class="searchbar" id="searchbar">
        <div class="segmented" role="radiogroup" aria-label="Искать по">
          <input type="radio" name="mode" id="m-plate" value="plate" checked /><label for="m-plate">Номер</label>
          <input type="radio" name="mode" id="m-key" value="key" /><label for="m-key">Ключ</label>
        </div>
        <svg class="searchbar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="searchbar__input" id="q" type="search" autocomplete="off" aria-label="Поисковый запрос" />
        <button class="searchbar__clear" id="clear" aria-label="Очистить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="content__head">
      <h2 style="margin:0;font-size:1.1rem">Результаты</h2>
      <span class="content__count" id="count"></span>
    </div>
    <section class="grid" id="results" aria-live="polite"></section>
  </main>

<script>
  const cars = [
    { id: 1, address: "Москва, Пресненская наб., 10", plate: "А123ВС 777", key: "KEY-0451", date: "2026-11-02" },
    { id: 2, address: "Санкт-Петербург, Невский пр., 28", plate: "М456ОР 178", key: "KEY-1187", date: "2026-10-27" },
    { id: 3, address: "Казань, ул. Баумана, 44", plate: "Т789УХ 116", key: "KEY-2093", date: "2026-11-08" },
  ];

  const lat2cyr = { A:"А",B:"В",E:"Е",K:"К",M:"М",H:"Н",O:"О",P:"Р",C:"С",T:"Т",Y:"У",X:"Х" };
  const norm = (s, plate) => {
    let r = s.toUpperCase().replace(/\s+/g, "");
    return plate ? r.replace(/[ABEKMHOPCTYX]/g, (c) => lat2cyr[c]) : r;
  };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
  const fmtDate = (iso) => new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

  const carSvg = `<svg viewBox="0 0 64 32" fill="currentColor"><path d="M10 22h-4a2 2 0 0 1-2-2v-4c0-1.5 1-2.6 2.4-3l6.6-1.8 6-5.4A6 6 0 0 1 23 4.5h14a6 6 0 0 1 4.3 1.8L47 12l9 1.6c1.8.3 3 1.9 3 3.6V20a2 2 0 0 1-2 2h-3"/><circle cx="16" cy="23" r="5"/><circle cx="48" cy="23" r="5"/></svg>`;
  const pinSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
  const calSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;

  function plateHtml(plate) {
    const [num, reg = ""] = plate.split(" ");
    return `<span class="plate"><span class="plate__num">${esc(num)}</span><span class="plate__reg">${esc(reg)}<span class="plate__rus">RUS<i class="plate__flag"></i></span></span></span>`;
  }

  let mode = "plate";
  const $q = document.getElementById("q"), $res = document.getElementById("results"),
        $count = document.getElementById("count"), $bar = document.getElementById("searchbar");

  function render() {
    const isPlate = mode === "plate";
    $q.placeholder = isPlate ? "Например, А123ВС 777" : "Например, KEY-0451";
    $bar.classList.toggle("has-value", !!$q.value);
    const q = norm($q.value, isPlate);
    const found = cars.filter((c) => norm(isPlate ? c.plate : c.key, isPlate).includes(q));
    $count.textContent = `Найдено: ${found.length}`;
    $res.innerHTML = found.length ? found.map((c, i) => `
      <article class="card" style="animation-delay:${i * 50}ms">
        <div class="card__photo">${c.photo ? `<img src="${esc(c.photo)}" alt="">` : carSvg}
          <span class="card__badge">${esc(c.address.split(",")[0])}</span></div>
        <div class="card__body">
          <p class="card__address">${pinSvg}${esc(c.address)}</p>
          <div class="card__row">${plateHtml(c.plate)}<span class="card__key">${esc(c.key)}</span></div>
          <div class="card__date">${calSvg}<time datetime="${c.date}">${fmtDate(c.date)}</time></div>
        </div>
      </article>`).join("")
      : `<div class="empty"><strong>Ничего не найдено</strong>Проверьте ${isPlate ? "номер" : "ключ"} или переключите режим поиска</div>`;
  }

  document.querySelectorAll('input[name="mode"]').forEach((r) =>
    r.addEventListener("change", () => { mode = r.value; render(); $q.focus(); }));
  $q.addEventListener("input", render);
  document.getElementById("clear").addEventListener("click", () => { $q.value = ""; render(); $q.focus(); });
  render();
</script>
</body>
</html>
